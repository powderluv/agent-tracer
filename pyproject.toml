[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-tracer"
version = "0.1.0"
description = "Trace and analyze Claude Code + Codex session logs (Perfetto + LanceDB)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "anush.e@gmail.com" }]
dependencies = []

[project.optional-dependencies]
# P1+ pulls these in; P0 is stdlib-only.
store = ["lancedb>=0.13", "pyarrow>=17"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
agent-tracer = "agent_tracer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tracer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
